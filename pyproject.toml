[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "querysmith"
version = "0.1.0"
description = "Tiered execution-plan analysis agent (SQL Server v1)"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["lxml>=5.0", "pyodbc>=5.0", "sqlglot>=25.0"]

[project.scripts]
querysmith = "querysmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
